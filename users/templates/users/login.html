{% extends 'table_reservation/base.html' %}
{% block title %}Вход на сайт{% endblock %}
{% block content %}
<div class="container mt-5">Вход на сайт

        {% csrf_token %}
        {{ form.as_p }}

    </form>
</div>
{% endblock %}
